name: Build/release

on:
  push:
    branches:
      - master
      - dev-*
    tags:
      - '**'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      # Do not let a failure on one OS hide the results from the others: formatPath,
      # getSSID and several isMacOS/isWindows branches are platform specific.
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts skips the postinstall `electron-builder install-app-deps`, which
      # downloads Electron headers and rebuilds native modules. The tests alias Electron
      # away entirely, so none of that is needed here.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

  release:
    needs: test
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v1

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v1
        with:
          node-version: 22

      - name: Build/release Electron app for macOS
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        if: matrix.os == 'macos-latest'
        uses: johannesjo/action-electron-builder@v1
        with:
          github_token: ${{ secrets.github_token }}
          mac_certs: ${{ secrets.mac_certs }}
          mac_certs_password: ${{ secrets.mac_certs_password }}
          build_script_name: "release"
          release: ${{ startsWith(github.ref, 'refs/tags/v') }}
          args: "--universal"

      - name: Build/release Electron app for other platforms
        if: matrix.os != 'macos-latest'
        uses: johannesjo/action-electron-builder@v1
        with:
          github_token: ${{ secrets.github_token }}
          build_script_name: "release"
          release: ${{ startsWith(github.ref, 'refs/tags/v') }}
