name: Build/release

on:
  push:
    branches:
      - master
      - dev-*
    tags:
      - '**'
  # Run the test job on pull requests too. Without this, a branch is only ever tested
  # after it has been merged, so a platform-specific failure lands on master before
  # anyone sees it. The release job stays gated on a tag, so this adds no publishing.
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npm run prettier

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      # Do not let a failure on one OS hide the results from the others: formatPath,
      # getSSID and several isMacOS/isWindows branches are platform specific.
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts skips the postinstall `electron-builder install-app-deps`, which
      # downloads Electron headers and rebuilds native modules. The tests alias Electron
      # away entirely, so none of that is needed here.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

  release:
    needs: [lint, test]
    # Push events only. Pull requests run the test job for feedback; building installers
    # on three platforms for every push to a PR branch would cost minutes and publish
    # nothing, since the release step is gated on a tag anyway.
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v1

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v1
        with:
          node-version: 22

      # electron-builder's own keychain handling (triggered by passing mac_certs/mac_certs_password
      # below as CSC_LINK/CSC_KEY_PASSWORD) unlocks its temp keychain's ACL with the *certificate's*
      # password instead of the keychain's own randomly-generated one (app-builder-lib's
      # codeSign/macCodeSign.ts createKeychain()/importCerts() — `-k` on `set-key-partition-list`
      # gets `cscKeyPassword`, not the `keychainPassword` used to create/unlock it). Older macOS
      # tolerated that mismatch when the keychain was already unlocked in-session; a macOS point
      # release on the macos-latest runner image stopped doing so (SecKeychainUnlock: "not
      # correct"), so we set up the keychain ourselves — with one password used consistently for
      # unlock and partition-list — and hand electron-builder the finished keychain via
      # CSC_KEYCHAIN instead of letting it manage one.
      - name: Import macOS code-signing certificate
        if: matrix.os == 'macos-latest'
        env:
          MAC_CERTS: ${{ secrets.mac_certs }}
          MAC_CERTS_PASSWORD: ${{ secrets.mac_certs_password }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$MAC_CERTS" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MAC_CERTS_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          EXISTING_KEYCHAINS=$(security list-keychains -d user | sed 's/[ "]//g')
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS
          rm -f "$CERT_PATH"
          echo "CSC_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build/release Electron app for macOS
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        if: matrix.os == 'macos-latest'
        uses: johannesjo/action-electron-builder@v1
        with:
          github_token: ${{ secrets.github_token }}
          build_script_name: "release"
          release: ${{ startsWith(github.ref, 'refs/tags/v') }}
          args: "--universal"

      - name: Build/release Electron app for other platforms
        if: matrix.os != 'macos-latest'
        uses: johannesjo/action-electron-builder@v1
        with:
          github_token: ${{ secrets.github_token }}
          build_script_name: "release"
          release: ${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Remove macOS signing keychain
        if: matrix.os == 'macos-latest' && always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
